<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>
    <style>
      html,
      body {
        background-color: #070616;
        color: #ffffff;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background-color: #0c0926;
        color: #111827;
      }
    </style>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../style.css" />
    <title>Amazing Events — Details</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg motivec-navbar">
      <div class="container-fluid px-2">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
          <span class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
              <circle cx="19" cy="5" r="1.5" fill="#ffffff" opacity="0.9"/>
            </svg>
          </span>
          <span class="brand-text">Amazing <span class="brand-text-accent">Events</span></span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a
                class="nav-link active fw-bold"
                aria-current="page"
                href="../index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold" href="./uncomingEvents.html"
                >Upcoming Events</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold" href="./pastEvents.html">Past Events</a>
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold" href="./stats.html">Statistics</a>
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold" href="./contact.html">Contact</a>
            </li>
          </ul>
        </div>

        <div class="motivec-nav-actions d-none d-lg-flex">
          <button
            type="button"
            id="themeToggleBtn"
            class="theme-toggle-btn"
            aria-label="Toggle dark and light theme"
            title="Switch Theme (Dark / Light)"
          >
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <a href="./contact.html" class="btn-motivec-cta">
            <span>Register</span>
            <span>↗</span>
          </a>
        </div>
      </div>
    </nav>

    <main class="motivec-main-sheet" style="padding-top: 7.5rem;">
      <div class="motivec-container">
        <div id="card-details"></div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script src="../dataNew.js"></script>
    <script src="../details.js"></script>
    <script>
      (function () {
        const toggleBtn = document.getElementById("themeToggleBtn");
        if (!toggleBtn) return;
        toggleBtn.addEventListener("click", function () {
          const root = document.documentElement;
          const current = root.getAttribute("data-theme") || "dark";
          const next = current === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          localStorage.setItem("theme", next);
        });
      })();
    </script>
  </body>
</html>
