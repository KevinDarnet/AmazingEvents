<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazing Events — Statistics</title>
    <script>
      (function () {
        const savedTheme = localStorage.getItem("motivec-theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="shortcut icon" href="../assets/logo.png" type="image/x-icon" />
  </head>

  <body class="body">
    <nav class="navbar navbar-expand-lg motivec-navbar">
      <div class="container-fluid px-2">
        <a class="motivec-brand" href="../index.html">
          <span class="motivec-brand-icon">
            <img src="../assets/logo.png" alt="Logo" />
          </span>
          <span>Motivec</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link fw-bold" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold" href="./uncomingEvents.html"
                >Upcoming Events</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold" href="./pastEvents.html"
                >Past Events</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link active fw-bold"
                aria-current="page"
                href="#"
                >Statistics</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold" href="./contact.html">Contact</a>
            </li>
          </ul>
        </div>

        <div class="motivec-nav-actions d-none d-lg-flex">
          <button
            type="button"
            id="themeToggleBtn"
            class="theme-toggle-btn"
            aria-label="Toggle dark and light theme"
            title="Switch Theme (Dark / Light)"
          >
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <a href="./contact.html" class="btn-motivec-cta">
            <span>Register</span>
            <span>↗</span>
          </a>
        </div>
      </div>
    </nav>

    <header>
      <div class="carousel-inner">
        <div class="carousel-item w-100 active" data-bs-interval="3000">
          <h2>Our Events: Books</h2>
          <img src="../assets/books.jpg" class="d-flex w-100" alt="..." />
        </div>
        <div class="carousel-item w-100" data-bs-interval="3000 ">
          <h2>Our Events: Cinema</h2>
          <img src="../assets/cinema.jpg" class="d-flex w-100 h-30" alt="..." />
        </div>
        <div class="carousel-item w-100" data-bs-interval="3000 ">
          <h2>Our Events: Concert</h2>
          <img src="../assets/concert.jpg" class="d-flex w-100" alt="..." />
        </div>
        <div class="carousel-item w-100" data-bs-interval="3000 ">
          <h2>Our Events: Food</h2>
          <img src="../assets/food.jpg" class="d-flex w-100" alt="..." />
        </div>
        <div class="carousel-item w-100" data-bs-interval="3000 ">
          <h2>Our Events: Museum</h2>
          <img src="../assets/museum.jpg" class="d-flex w-100" alt="..." />
        </div>
        <div class="carousel-item w-100" data-bs-interval="3000 ">
          <h2>Our Events: Party</h2>
          <img src="../assets/party.jpg" class="d-flex w-100" alt="..." />
        </div>
        <div class="carousel-item w-100" data-bs-interval="3000 ">
          <h2>Our Events: Race</h2>
          <img src="../assets/race.jpg" class="d-flex w-100" alt="..." />
        </div>
      </div>
    </header>

    <main class="motivec-main-sheet d-flex flex-column flex-grow-1">
      <div class="motivec-container">
        <div class="sectiondelstats">
          <table class="table container w-100">
            <thead>
              <tr>
                <th colspan="3" class="fs-3 fw-bold text-center py-3">
                  Events Statistics
                </th>
              </tr>
            </thead>
            <tbody id="cuerpo1" class="w-100"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script src="../dataNew.js"></script>
    <script src="../stats.js"></script>
    <script>
      (function () {
        const toggleBtn = document.getElementById("themeToggleBtn");
        if (!toggleBtn) return;
        toggleBtn.addEventListener("click", function () {
          const root = document.documentElement;
          const current = root.getAttribute("data-theme") || "dark";
          const next = current === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          localStorage.setItem("motivec-theme", next);
        });
      })();
    </script>
  </body>
</html>
